name: autoapply-saas
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: autoapply
      POSTGRES_USER: autoapply
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-autoapply_dev_only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autoapply -d autoapply"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    environment: &backend_env
      DATABASE_URL: postgresql+psycopg://autoapply:${POSTGRES_PASSWORD:-autoapply_dev_only}@db:5432/autoapply
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-development_change_this_secret_before_publication}
      STORAGE_DIR: /data/resumes
      SECURE_COOKIES: "false"
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_CHAT_MODEL: ${GEMINI_CHAT_MODEL:-gemini-3.8-flash}
      GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-gemini-embedding-001}
      GEMINI_BASE_URL: ${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai/}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-4.1-mini}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      GREENHOUSE_BOARDS: ${GREENHOUSE_BOARDS:-}
      LEVER_SITES: ${LEVER_SITES:-}
      ASHBY_BOARDS: ${ASHBY_BOARDS:-}
      REMOTIVE_ENABLED: ${REMOTIVE_ENABLED:-true}
      ARBEITNOW_ENABLED: ${ARBEITNOW_ENABLED:-false}
      PUBLIC_API_URL: http://api:8000
      DEMO_SEED: "true"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - resume_files:/data/resumes
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ./backend
    command: celery -A app.tasks.celery_app worker -Q default --loglevel=info --concurrency=2
    environment: *backend_env
    volumes:
      - resume_files:/data/resumes
    depends_on:
      - api
      - redis

  browser-worker:
    profiles: ["browser"]
    build:
      context: ./backend
      dockerfile: Dockerfile.browser
    environment: *backend_env
    volumes:
      - resume_files:/data/resumes
    depends_on:
      - api
      - redis

  web:
    build: ./frontend
    environment:
      API_INTERNAL_URL: http://api:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  resume_files:
